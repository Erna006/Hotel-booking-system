x-backend: &backend
  image: hotel-booking-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    POSTGRES_URL: postgresql+asyncpg://hotel:hotel@db:5432/hotel
    JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET in .env; see README.md}
    JWT_ISSUER: ${JWT_ISSUER:-hotel-booking}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-hotel-api}
    ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - hotel_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  hotel_data:
